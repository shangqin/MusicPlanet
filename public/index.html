<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>音乐星球 · 把快乐听进心里</title><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="#home"><span class="brand-icon">♫</span> 音乐星球<small>MUSIC PLANET</small></a><div class="nav-label">我的小宇宙</div><nav><button data-view="home" class="active">◈ <span>音乐目录</span></button></nav><div class="sidebar-art"><div>✦</div><span>每一首歌，<br>都是一颗小星星。</span><small>今天也要开心地长大呀</small></div><button class="install" id="install">＋ 添加到主屏幕</button><p class="sidebar-foot">为小小的你，装下大大的快乐</p></aside>
<main><header><div class="crumb">我的小宇宙 <span>/</span> <strong id="page-label">音乐目录</strong></div><span class="avatar">☺</span></header>
<section class="collections" id="collections"><div class="section-heading"><h2>我的音乐 <span>选一个目录，开始听歌</span></h2><small id="album-count"></small></div><div id="album-grid"></div></section>
<section class="song-section" id="song-section" hidden><button id="back-home" class="back-button">← 返回音乐目录</button><div class="section-heading"><h2 id="list-title">全部歌曲 <span id="track-count"></span></h2><button id="play-all" class="text-button">▶ 播放全部</button></div><div class="table-head"><span>#</span><span>歌曲 / 小小的快乐</span></div><div id="tracks"></div></section><p id="status" role="status"></p><footer>用音乐，陪伴每一个闪闪发光的童年 <span>✦</span></footer></main>
<div class="player"><div class="now"><img id="now-cover" src="icon.svg" alt="歌单封面"><div><strong id="now-title">准备好听歌了吗？</strong><small id="now-album">选一首歌，开启快乐旅程</small></div></div><div class="transport"><div class="transport-buttons"><button id="mode" aria-label="切换播放模式" title="列表循环">↻</button><button id="prev" aria-label="上一首">⏮</button><button id="toggle" class="play-button" aria-label="播放">▶</button><button id="next" aria-label="下一首">⏭</button><button id="timer" aria-label="设置睡眠定时" title="睡眠定时">◷</button></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="duration">0:00</span></div></div><div class="volume">♪ <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量"><span id="timer-label"></span></div></div><audio id="audio" preload="metadata"></audio><dialog id="help"><button id="close-help" aria-label="关闭">×</button><h2>把星球装进口袋</h2><p>iPhone / iPad：在 Safari 中打开网站，点击分享按钮，再选择「添加到主屏幕」。</p><p>首次播放需要轻点播放按钮。</p></dialog><script type="module" src="app.js"></script></body></html>
